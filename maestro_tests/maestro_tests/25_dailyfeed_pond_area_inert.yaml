# FEATURE: Daily Feed - pond area field is inert (EVIDENCE FLOW)
# PURPOSE: DailyFeedCalculatorScreen.tsx declares pondAreaM2 (:59), binds it to
#          an editable input (:223) and lists it as an effect dep (:91), but
#          handleCalculate (:93-135) never reads it. This flow enters an absurd
#          pond area alongside the 01_ inputs and asserts the SAME output,
#          proving the field cannot influence any result.
# INPUTS: MBW=20, SR=80, Count=100000, FR=3, PondArea=999999
# EXPECTED: identical to 01_ -> '48.0' kg, biomass '1,600', per-meal '12.0'
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- tapOn: "Daily Feed Amount"
- tapOn: '18.4'
- inputText: "20"
- hideKeyboard
- tapOn: "78"
- inputText: "80"
- hideKeyboard
- tapOn: "28700"
- inputText: "100000"
- hideKeyboard
- tapOn: '3.2'
- inputText: "3"
- hideKeyboard
- tapOn: "4000"
- inputText: "999999"
- hideKeyboard
- tapOn: "Calculate"
- assertVisible: '.*48.0.*'
- assertVisible: '.*1,600.*'
- assertVisible: '.*12.0.*'
