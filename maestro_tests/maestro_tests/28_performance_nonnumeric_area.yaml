# FEATURE: Cultivation Performance - non-numeric optional Pond Area (EVIDENCE FLOW, FIXED)
# PURPOSE: Guard at CultivationPerformanceScreen.tsx is now
#              if (areaM2 && (area === null || area <= 0))
#          area comes from parseNumericInput, so area="abc" parses to null
#          instead of NaN, and null is tested explicitly - the guard fires
#          and the farmer sees the same "Pond area must be a positive number"
#          alert as any other invalid optional field, instead of the
#          Productivity metric silently disappearing with no error.
# INPUTS: Seed=100000, Harvested=1500, Feed=2250, Days=120, MBW=20, SR=80, Area="abc"
# EXPECTED (fixed behaviour): the "Pond area must be a positive number" alert.
# ACTUAL (asserted here): Validation Error alert fires, no results render.
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- tapOn: "Cultivation Performance"
- tapOn: 'e.g. 500000'
- inputText: "100000"
- hideKeyboard
- tapOn:
    text: '0.0'
    index: 0
- inputText: "1500"
- hideKeyboard
- tapOn:
    text: '0.0'
    index: 1
- inputText: "2250"
- hideKeyboard
- tapOn: 'e.g. 120'
- inputText: "120"
- hideKeyboard
- tapOn: 'e.g. 25.0'
- inputText: "20"
- hideKeyboard
- tapOn: 'e.g. 85'
- inputText: "80"
- hideKeyboard
- tapOn: "Optional"
- inputText: "abc"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Calculate"
    direction: DOWN
- tapOn: "Calculate"
- assertVisible: "Validation Error"
- assertNotVisible: "Results"
