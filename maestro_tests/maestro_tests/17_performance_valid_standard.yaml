# FEATURE: Cultivation Performance - standard valid input
# INPUTS: Seed=100000, Harvested=1500 kg, Feed=2250 kg, Days=120,
#         FinalMBW=20 g, FinalSR=80 %, Area=5000 m2
# EXPECTED: FCR = 2250/1500 = 1.50
#           ADG = (20-0)/120 = 0.16666 -> 3dp -> 0.167 g/day
#           SR  = round(100000*80/100)/100000*100 = 80.0 %
#           Productivity = 1500/5000 = 0.30 kg/m2
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- tapOn: "Cultivation Performance"
- assertVisible: "Input Data"
- tapOn: 'e.g. 500000'
- inputText: "100000"
- hideKeyboard
- tapOn:
    text: '0.0'
    index: 0
- inputText: "1500"
- hideKeyboard
- tapOn:
    text: '0.0'
    index: 1
- inputText: "2250"
- hideKeyboard
- tapOn: 'e.g. 120'
- inputText: "120"
- hideKeyboard
- tapOn: 'e.g. 25.0'
- inputText: "20"
- hideKeyboard
- tapOn: 'e.g. 85'
- inputText: "80"
- hideKeyboard
- tapOn: "Optional"
- inputText: "5000"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Calculate"
    direction: DOWN
- tapOn: "Calculate"
- assertVisible: "Results"
- assertVisible: '.*1\.50.*'
- assertVisible: '.*0\.167.*'
- assertVisible: '.*80\.0%.*'
- assertVisible: '.*0\.30.*'
