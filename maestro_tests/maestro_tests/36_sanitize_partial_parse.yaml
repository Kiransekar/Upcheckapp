# PILLAR: Input Sanitization - trailing-garbage numeric input (EVIDENCE FLOW, FIXED)
# INPUTS: MBW="20abc", SR=80, Count=100000, FR=3
# EXPECTED (defensible): the field is declared numeric, so a value carrying
#          trailing letters is not a number and must be rejected with the same
#          "MBW must be a positive number" alert TC-07 ("abc!@#") produces.
# ACTUAL (fixed): parseNumericInput uses Number(), which rejects trailing
#         garbage outright instead of truncating to a prefix, so "20abc" now
#         parses to null and the MBW guard fires the Validation Error alert.
# INTENT: prove the numeric guards reject a partially numeric string now that
#         validation tests parseNumericInput's null result rather than the
#         truthiness of a parseFloat prefix.
# See: QA_ENGINEERING_HANDOVER_REPORT.md -> BUG-017
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- tapOn: "Daily Feed Amount"
- tapOn: "18.4"
- inputText: "20abc"
- hideKeyboard
- tapOn: "78"
- inputText: "80"
- hideKeyboard
- tapOn: "28700"
- inputText: "100000"
- hideKeyboard
- tapOn: "3.2"
- inputText: "3"
- hideKeyboard
- tapOn: "Calculate"
# The same guard that fires for "abc!@#" (TC-07) now also fires for "20abc" ...
- assertVisible: "Validation Error"
# ... and no computed result is rendered from the truncated prefix.
- assertNotVisible: "Required Daily Feed"
