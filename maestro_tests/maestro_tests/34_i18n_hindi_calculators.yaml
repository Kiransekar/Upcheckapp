# PILLAR: Localization (i18n) - Hindi rendering of the calculator surface
# INTENT: two things at once, both now asserting FIXED behaviour -
#   (a) translated keys DO render in Hindi (hub title, calculator names, labels)
#   (b) the placeholders DO translate too. BUG-013 found 39 hardcoded English
#       literals across the five calculator screens - including every
#       placeholder="..." prop - that survived a language switch. They are now
#       routed through t(), so CultivationPerformanceScreen's Total Seed and
#       Days of Culture placeholders render as "उदा. 500000" and "उदा. 120"
#       under a Hindi UI instead of the old literal "e.g. 500000" / "e.g. 120".
# NOTE: this flow leaves the app in HINDI. Run 35_i18n_restore_english.yaml
#       afterwards to put the device back the way it was found.
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- back
- tapOn: "हिन्दी"
- extendedWaitUntil:
    visible: "सेटिंग्स"
    timeout: 15000
- tapOn: "कैलकुलेटर"
- extendedWaitUntil:
    visible: "टूल्स और कैलकुलेटर"
    timeout: 15000
# (a) translated content renders
- assertVisible: "उत्पादन प्रदर्शन"
- assertVisible: "दैनिक आहार मात्रा"
- assertVisible: "उत्पाद खुराक"
- assertVisible: "वृद्धि और कटाई"
- tapOn: "उत्पादन प्रदर्शन"
- assertVisible: "कुल बीज (संख्या)"
# (b) placeholders now translate too -> BUG-013 fixed
- assertVisible: "उदा. 500000"
- assertVisible: "उदा. 120"
