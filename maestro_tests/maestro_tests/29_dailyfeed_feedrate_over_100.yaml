# FEATURE: Daily Feed - feeding rate above the server maximum (EVIDENCE FLOW, FIXED)
# PURPOSE: The client guard (DailyFeedCalculatorScreen.tsx) now mirrors the
#          server DTO's @Max(100) (backend .../dto/calculation.dto.ts:45) with
#          `fr === null || fr <= 0 || fr > 100`. So FR=150 is now rejected
#          client-side with the same field-named 'Validation Error' every other
#          out-of-range input gives, instead of reaching the network and coming
#          back a generic 400 failure (QA BUG-010).
# INPUTS: MBW=20, SR=80, Count=100000, FeedingRate=150
# EXPECTED (fixed behaviour): a client-side 'Validation Error' naming the field.
# ACTUAL (asserted here): client Validation Error fires, no result rendered.
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- tapOn: "Daily Feed Amount"
- tapOn: '18.4'
- inputText: "20"
- hideKeyboard
- tapOn: "78"
- inputText: "80"
- hideKeyboard
- tapOn: "28700"
- inputText: "100000"
- hideKeyboard
- tapOn: '3.2'
- inputText: "150"
- hideKeyboard
- tapOn: "Calculate"
- assertVisible: "Validation Error"
- assertNotVisible: "Required Daily Feed"
