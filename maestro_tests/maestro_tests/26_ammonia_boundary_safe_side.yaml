# FEATURE: Free Ammonia - band boundary, WARNING side (FIXED behaviour)
# PURPOSE: BUG-001's fix bands the ROUNDED (displayed) nh3, not the raw double,
#          so a value that prints '0.1000' always lands in the band its own
#          copy claims. This flow pins that for the input that used to be
#          misclassified as SAFE.
# INPUTS: TAN=1.032, pH=8.2, Temp=29, Salinity=15 (entered explicitly,
#         NOT the screen default - BUG-002 removes that default)
# EXPECTED: raw nh3 = 0.09998399 rounds to displayed '0.1000', which is >= 0.1,
#           so the server now bands it WARNING - matching the legend printed
#           right next to the figure.
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- tapOn: 'Free Ammonia.*'
- tapOn: 'e.g. 1.5'
- inputText: '1.032'
- hideKeyboard
- tapOn: 'e.g. 8.2'
- inputText: '8.2'
- hideKeyboard
- tapOn: 'e.g. 29'
- inputText: "29"
- hideKeyboard
- tapOn: 'e.g. 15'
- inputText: '15'
- hideKeyboard
- tapOn: 'Calculate NH.*'
- assertVisible: '.*0\.1000.*'
- assertVisible: '.*WARNING \(Server\).*'
- assertNotVisible: '.*SAFE \(Server\).*'
