# FEATURE: Daily Feed Amount - standard valid input
# INPUTS: MBW=20 g, SR=80 %, Count=100000, FeedingRate=3 %
# EXPECTED: biomass = (100000*80/100)*20/1000 = 1600 kg -> "1,600"
#           dailyFeed = 1600*3/100 = 48.00 -> '48.0' kg
#           perMeal   = 48/4 = '12.0'  | meals = '4'
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- tapOn: "Daily Feed Amount"
- assertVisible: "Daily feed"
- tapOn: '18.4'
- inputText: "20"
- hideKeyboard
- tapOn: "78"
- inputText: "80"
- hideKeyboard
- tapOn: "28700"
- inputText: "100000"
- hideKeyboard
- tapOn: '3.2'
- inputText: "3"
- hideKeyboard
- tapOn: "Calculate"
- assertVisible: "Required Daily Feed"
- assertVisible: '.*48.0.*'
- assertVisible: '.*1,600.*'
- assertVisible: '.*12.0.*'
