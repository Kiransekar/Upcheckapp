# PILLAR: Boundary Resilience - oversized numeric buffer (EVIDENCE FLOW)
# INPUTS: MBW=20, SR=80, Count=99999999999999999999 (10^20), FR=3
# EXPECTED (defensible): an upper-bound guard, or at minimum a figure the user
#          can actually read.
# ACTUAL: no bound at all. The app renders
#             REQUIRED DAILY FEED = 48000000000000000.0 kg
#         i.e. 4.8e16 kg/day (~48 trillion tonnes of feed) as a confident
#         result, and the BIOMASS KG stat clips to "16,00,00,00..." because
#         StatRow cannot fit the magnitude.
# INTENT: prove there is no sanity ceiling on stocking count / biomass and that
#         large magnitudes truncate rather than degrade gracefully.
# See: QA_ENGINEERING_HANDOVER_REPORT.md -> BUG-011
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- tapOn: "Daily Feed Amount"
- tapOn: "18.4"
- inputText: "20"
- hideKeyboard
- tapOn: "78"
- inputText: "80"
- hideKeyboard
- tapOn: "28700"
- inputText: "99999999999999999999"
- hideKeyboard
- tapOn: "3.2"
- inputText: "3"
- hideKeyboard
- tapOn: "Calculate"
# No upper-bound guard fires ...
- assertNotVisible: "Validation Error"
# ... and a physically impossible figure is presented as a result.
- assertVisible: "Required Daily Feed"
- assertVisible: '.*48000000000000000\.0 kg.*'
- assertVisible: '.*12000000000000000\.0.*'
