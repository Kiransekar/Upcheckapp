# PILLAR: Boundary Resilience - oversized numeric buffer (EVIDENCE FLOW, FIXED)
# INPUTS: MBW=20, SR=80, Count=99999999999999999999 (10^20), FR=3
# EXPECTED (defensible): an upper-bound guard, or at minimum a figure the user
#          can actually read.
# ACTUAL (fixed): MAX_STOCKING_COUNT (100,000,000) now caps stocking count
#         client-side, so a pond of 10^20 post-larvae is rejected with the
#         same 'Validation Error' alert as any other invalid Count, instead of
#         rendering REQUIRED DAILY FEED = 48000000000000000.0 kg (~48 trillion
#         tonnes) as a confident result with the BIOMASS KG stat clipped to
#         "16,00,00,00...".
# INTENT: prove the sanity ceiling on stocking count now rejects the oversized
#         buffer client-side rather than truncating a physically impossible
#         magnitude into a plausible-looking result.
# See: QA_ENGINEERING_HANDOVER_REPORT.md -> BUG-011
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- tapOn: "Daily Feed Amount"
- tapOn: "18.4"
- inputText: "20"
- hideKeyboard
- tapOn: "78"
- inputText: "80"
- hideKeyboard
- tapOn: "28700"
- inputText: "99999999999999999999"
- hideKeyboard
- tapOn: "3.2"
- inputText: "3"
- hideKeyboard
- tapOn: "Calculate"
# The upper-bound guard now fires ...
- assertVisible: "Validation Error"
# ... and no physically impossible figure is ever rendered.
- assertNotVisible: "Required Daily Feed"
