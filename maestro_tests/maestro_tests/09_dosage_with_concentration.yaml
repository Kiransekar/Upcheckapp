# FEATURE: Product Dosage - product concentration adjustment
# INPUTS: Area=5000, Depth=1.2, Target=2 ppm, Concentration=50 %
# EXPECTED: headline is the mass the farmer weighs out, i.e. the
#           concentration-corrected figure = (6000*2)/(50*10) = 24.000 kg
#           (fixed: BUG-003 - a 50% product previously headlined the
#           100%-active-basis 12.00 kg, half the dose the farmer needed).
#           The 100%-active-ingredient basis, server amountKg = 12.00 kg,
#           still appears as supporting detail.
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- tapOn: "Product Dosage"
- tapOn: 'e.g. 5000'
- inputText: "5000"
- hideKeyboard
- tapOn: 'e.g. 1.2'
- inputText: '1.2'
- hideKeyboard
- tapOn: 'e.g. 5.0'
- inputText: "2"
- hideKeyboard
- tapOn: 'e.g. 100.*'
- inputText: "50"
- hideKeyboard
- tapOn: "Calculate"
- assertVisible: '.*24\.000.*'
- assertVisible: '.*12\.00 kg.*'
- assertVisible: "100% active-ingredient basis:"
