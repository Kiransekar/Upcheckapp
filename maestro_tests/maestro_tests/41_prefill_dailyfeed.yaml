# PILLAR: Prefill path (applyContext) - asserts FIXED behaviour, no longer an
# evidence flow. BUG-018 and BUG-019 are resolved in prefill.ts; this flow now
# pins the fix instead of the defect.
#
# INPUTS: pick QA-AUDIT-POND (stocking count 500000, area 5000 m2, day 1,
#         no sampling logged) then open Daily Feed Amount. Nothing is typed.
#
# EXPECTED (defensible): fields the pond can actually supply are filled, and the
#          "Filled from the pond" banner reflects what was really filled.
#
# NOW, after the fix:
#     Count      = 500000   <- genuinely prefilled from crop.stockingCount
#     Pond Area  = 5000     <- genuinely prefilled from areaM2 (and inert, BUG-005)
#     SR (%)     = EMPTY    <- no longer fabricated as 100%. survivalPctFrom
#                              returns null with no sampling (abwG == null), so
#                              its placeholder "78" is what renders (BUG-019 fixed).
#     MBW (g)    = EMPTY    <- abwG is null with no sampling, so the required
#                              field is NOT filled, and the banner correctly says
#                              so instead of claiming the form was filled
#                              (BUG-018 fixed).
#
# See: QA_ENGINEERING_HANDOVER_REPORT.md -> BUG-018, BUG-019
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- tapOn: "QA-AUDIT-POND"
- tapOn: "Daily Feed Amount"
- extendedWaitUntil:
    visible: "Daily feed"
    timeout: 15000
# The banner must NOT claim the form was filled when the required MBW field
# was not (BUG-018 fixed).
- assertNotVisible: "Filled from the pond you picked.*"
# These two really were filled by the pond.
- assertVisible: "500000"
# Survival is no longer invented: the SR field shows its placeholder, not 100.
- assertVisible: "78"
# MBW is still empty on an un-sampled pond: its placeholder is what renders.
- assertVisible: "18.4"
