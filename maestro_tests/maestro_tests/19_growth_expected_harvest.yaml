# FEATURE: Growth & Harvest - Expected Harvest
# INPUTS: StockingCount=100000, SurvivalRate=80 %, TargetWeight=20 g
# EXPECTED: expectedCount = round(100000*80/100) = 80,000 shrimp
#           expectedWeightKg = 80000*20/1000 = 1600.00 kg
appId: com.upcheck.app
---
- runFlow: _nav_to_hub.yaml
- tapOn: "Growth & Harvest"
- assertVisible: "Expected Harvest"
- tapOn: 'e.g. 500000'
- inputText: "100000"
- hideKeyboard
- tapOn: 'e.g. 80'
- inputText: "80"
- hideKeyboard
- tapOn: 'e.g. 20'
- inputText: "20"
- hideKeyboard
- tapOn:
    text: "Calculate"
    index: 0
- assertVisible: '.*80,000.*'
- assertVisible: '.*1600\.00.*'
